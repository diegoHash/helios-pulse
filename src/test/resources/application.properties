spring.application.name=helios-pulse-test
spring.config.import=

spring.datasource.url=jdbc:h2:mem:cbt_security;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.cache.type=simple
spring.data.redis.repositories.enabled=false

# Deliberately low-entropy, test-only material. It must never be used outside tests.
application.security.jwt.secret-key=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
application.security.jwt.expiration=60000
application.security.jwt.refresh-token.expiration=120000
app.encryption.key=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

application.telegram.bot.token=
application.telegram.bot.chatId=0
application.frontend.url=http://localhost.invalid

spring.mail.host=localhost.invalid
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

gemini.api.key=
openweathermap.api.key=
whatsapp.api.token=
whatsapp.phone.id=

logging.level.org.springframework.security=WARN
