spring.application.name=helios-pulse
springdoc.api-docs.enabled=${HELIOS_SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${HELIOS_SWAGGER_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${ETECC_DDBB_URL:jdbc:mysql://localhost:3306/CaribbeanCloud_Schema}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.password=${ETECC_DDBB_PASS}
spring.datasource.username=${ETECC_DDBB_USERNAME:root}
application.security.jwt.secret-key=${ETECC_JWT_SECRET}
app.encryption.key=${HELIOS_PULSE_ENCRYPTION_KEY}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database=mysql
spring.jpa.properties.hibernate.default_batch_fetch_size=500
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
server.port=9595
logging.level.org.springframework.security=DEBUG
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# HikariCP specific settings
# Set max-lifetime to 10 minutes (600000 ms) to be shorter than DB wait_timeout,
# preventing "Failed to validate connection" warnings.
spring.datasource.hikari.max-lifetime=600000

# Redis Configuration (Ready for deployment / local)
spring.data.redis.host=${ETECC_REDIS_HOST:localhost}
spring.data.redis.port=${ETECC_REDIS_PORT:6379}
# Changed to 'simple' to avoid connection refused errors locally when Redis isn't running
spring.cache.type=${ETECC_CACHE_TYPE:simple}

# SMTP Configuration
spring.mail.host=${ETECC_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${ETECC_MAIL_PORT:587}
spring.mail.username=${ETECC_MAIL_USERNAME:correo@ejemplo.com}
spring.mail.password=${ETECC_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Telegram Bot
application.telegram.bot.token=${ETECC_TELEGRAM_BOT_TOKEN:}
application.telegram.bot.chatId=${ETECC_TELEGRAM_BOT_CHAT_ID:0}

# Frontend
application.frontend.url=${ETECC_FRONTEND_URL:https://caribbean-one.site}

# Predictive Engine API Keys
gemini.api.key=${GEMINI_API_KEY:}
openweathermap.api.key=${OPENWEATHERMAP_API_KEY:}

# WhatsApp API Integration
whatsapp.api.token=${ETECC_WHATSAPP_TOKEN:}
whatsapp.phone.id=${ETECC_WHATSAPP_PHONE_ID:}
